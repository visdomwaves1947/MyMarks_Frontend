<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%">
  <defs>
    <linearGradient id="deepOcean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="30%" stop-color="#0369a1" />
      <stop offset="65%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0b1736" />
    </linearGradient>

    <radialGradient id="topCyanGlow" cx="25%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="midBlueGlow" cx="80%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="silkRibbon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.7" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#1d4ed8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="silkRibbon2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- Base Oceanic Gradient -->
  <rect width="800" height="1200" fill="url(#deepOcean)" />
  <rect width="800" height="1200" fill="url(#topCyanGlow)" />
  <rect width="800" height="1200" fill="url(#midBlueGlow)" />

  <!-- Flowing Silk Waves -->
  <path d="M-80,260 C220,120 440,480 880,240 L880,1280 L-80,1280 Z" fill="url(#silkRibbon1)" />
  <path d="M-60,520 C260,340 520,780 880,480 L880,1280 L-60,1280 Z" fill="url(#silkRibbon2)" />
  <path d="M-100,780 C180,640 480,940 900,720 L900,1280 L-100,1280 Z" fill="url(#silkRibbon1)" opacity="0.6" />

  <!-- Subtle Ambient Glow Overlay -->
  <circle cx="200" cy="220" r="180" fill="#bae6fd" opacity="0.25" />
  <circle cx="650" cy="700" r="220" fill="#38bdf8" opacity="0.2" />
</svg>
